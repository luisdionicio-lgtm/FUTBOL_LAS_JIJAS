name: lasjijas
x-backend: &backend
 build:
  context: .
  dockerfile: backend/Dockerfile
 image: lasjijas-backend:local
 env_file: .env
 environment:
  DATABASE_URL: postgresql://lasjijas:${POSTGRES_PASSWORD}@db:5432/lasjijas
  REDIS_URL: redis://redis:6379
 restart: unless-stopped
services:
 db:
  image: postgres:16-alpine
  environment:
   POSTGRES_USER: lasjijas
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: lasjijas
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: [CMD-SHELL, 'pg_isready -U lasjijas -d lasjijas']
   interval: 5s
   timeout: 3s
   retries: 20
  restart: unless-stopped
 redis:
  image: redis:7-alpine
  command: redis-server --save "" --appendonly no
  healthcheck:
   test: [CMD, redis-cli, ping]
   interval: 5s
   timeout: 3s
   retries: 20
  restart: unless-stopped
 migrate:
  <<: *backend
  restart: 'no'
  command: sh -c 'npm run db:migrate -w backend && npm run seed -w backend'
  depends_on:
   db:
    condition: service_healthy
 backend:
  <<: *backend
  deploy:
   replicas: 2
  depends_on:
   migrate:
    condition: service_completed_successfully
   redis:
    condition: service_healthy
  healthcheck:
   test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
   interval: 10s
   timeout: 3s
   retries: 6
 frontend:
  build:
   context: .
   dockerfile: frontend/Dockerfile
  healthcheck:
   test: [CMD, wget, -q, --spider, http://127.0.0.1/]
   interval: 10s
   timeout: 3s
   retries: 6
  restart: unless-stopped
 nginx:
  image: nginx:1.28-alpine
  ports:
   - 127.0.0.1:8080:80
  volumes:
   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  depends_on:
   backend:
    condition: service_healthy
   frontend:
    condition: service_healthy
  healthcheck:
   test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
   interval: 15s
   timeout: 3s
   retries: 5
  restart: unless-stopped
volumes:
 postgres_data:
