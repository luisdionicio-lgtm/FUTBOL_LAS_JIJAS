events { worker_connections 1024; }
http {
 resolver 127.0.0.11 valid=5s ipv6=off;
 upstream api_backend { zone backend 64k; server backend:3000 resolve max_fails=2 fail_timeout=5s; keepalive 32; }
 server {
  listen 80;
  server_name localhost;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ { proxy_pass http://api_backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_next_upstream error timeout http_502 http_503; proxy_connect_timeout 2s; proxy_read_timeout 65s; }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
 }
}
